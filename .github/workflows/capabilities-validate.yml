name: Validate docs frontmatter taxonomies

concurrency:
  group: pullrequest-untrusted-capabilities-${{ github.event.number }}
  cancel-in-progress: true

# No paths: filter, on purpose. This job is a required status check, and a
# required check skipped by a path filter never reports, which blocks every
# PR that doesn't touch docs/. Running everywhere also covers edits to
# data/capabilities.yaml, data/diataxis.yaml, and the script itself, any of
# which can invalidate pages that didn't change. A full scan takes seconds.
#
# Keep the job name below unchanged: branch protection requires it by name.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate_capabilities:
    name: Check docs/ capability and Diataxis frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check capabilities and Diataxis modes
        run: python3 scripts/frontmatter_rules.py
