name: PR Test Label Manager

on:
  pull_request_target:
    branches: [ 'main' ]
    types: [ opened ]

jobs:
  pr_test_label_manager:
    name: PR Test Label Manager
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' &&
      contains(fromJson('["opened", "synchronize", "reopened"]'), github.event.action)
    steps:
      - name: "Check Membership and Label PR"
        uses: actions/github-script@v6
        id: check-membership
        with:
          github-token: ${{ secrets.PR_TOKEN }}
          script: |
            let prNumber = context.payload.pull_request && context.payload.pull_request.number;
            const pr = context.payload.pull_request;
            const sender = context.payload.sender.login;
            // Non-member bots that push same-repo branches; forks never take this path.
            const trustedBots = ["dependabot[bot]", "viam-overwatch[bot]"];
            const isFork = pr.head.repo?.full_name !== pr.base.repo.full_name;
            if (!isFork && trustedBots.includes(sender)) {
              await github.rest.issues.addLabels({owner: "viamrobotics", repo: "docs", issue_number: prNumber, labels: ["safe to build"]});
              return;
            }
            try {
              let orgResp = await github.rest.orgs.checkMembershipForUser({org: "viamrobotics", username: sender});
              if (orgResp.status === 204) {
                await github.rest.issues.addLabels({owner: "viamrobotics", repo: "docs", issue_number: prNumber, labels: ["safe to build"]});
              }
            } catch (error) {
              console.log("here");
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: "viamrobotics",
                repo: "docs",
                body: '👋 Thanks for contributing! A reviewer will look at it on the next working day!'
              })
            }              
