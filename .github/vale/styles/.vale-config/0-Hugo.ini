[*.md]
# Exclude `{{< ... >}}`, `{{% ... %}}`, [Who]({{< ... >}}), with or without
# the spaces inside the delimiters: Hugo reads `{{<ref "a.md">}}` too.
TokenIgnores = ({{[%<] ?.* ?[%>]}}.*?{{[%<] ?/.* ?[%>]}}), \
(\[.+\]\({{< ?.+ ?>}}\)), \
(?m)(?:^|[^\S\r\n])({{[%<] ?[\w/-]+(?: .+?)? ?[%>]}})(?=\s), \
[^\S\r\n]({{[%<](?:/\*) .* (?:\*/)[%>]}})\s

# Exclude `{{<  myshortcode `This is some <b>HTML</b>, ... >}}`
BlockIgnores = (?sm)^({{[%<] ?[\w/-]+\s(?:[^{]*?\s)?[%>]}})\n$, \
(?s) *({{< highlight [^>]* ?>}}.*?{{< ?/ ?highlight >}})
