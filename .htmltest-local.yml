DirectoryPath: "dist"
EnforceHTTPS: true
IgnoreEmptyHref: true
IgnoreInternalEmptyHash: true
IgnoreDirectoryMissingTrailingSlash: false
# <link> tags (stylesheets, canonical, RSS, and our own Markdown-mirror
# rel="alternate" links) are all build-generated, not human-authored content.
# The Markdown-mirror alternate link on section/home pages points at a flat
# .md URL that only resolves via a Netlify redirect htmltest can't see, so it
# always reads as broken here even though it works in production. Disabling
# CheckLinks (not CheckAnchors) skips only <link> tags -- every real <a href>
# content link, including any that happen to end in .md, is still checked.
CheckLinks: false
IgnoreURLs:
  - "viam.setup"
  - "orangepi.org"
  - "rtk2go.com"
IgnoreDirs:
  - "lib"
  - "operate"
  - "manage"
  - "data-ai"
CacheExpires: "6h"
# IgnoreDirs: - if we need to ever ignore files
CheckExternal: false