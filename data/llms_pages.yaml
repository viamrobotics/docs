# Curated pages linked from /llms.txt, optionally inlined in full into
# /llms-full.txt. Generated by assets/llms.txt and assets/llms-full.txt
# (Hugo Pipes templates) from this data -- see CLAUDE.md for the full
# system.
#
# Each page's title/URL/description are pulled live from the page itself
# via site.GetPage; only `path` and (optionally) `full` are set here.
#
# `full: true` inlines the page's full rendered text into llms-full.txt
# (through the same render-page-markdown.html partial every page's own
# .md mirror uses). Omit it (default false) to link the page from
# llms.txt without inlining it.
#
# Curation heuristic: flag orientation/workflow pages full=true -- an
# agent benefits from reading the whole thing before acting. Leave
# reference/API pages link-only: an agent almost always wants one
# resource's page, not all of them concatenated, and fetching that page's
# own .md mirror directly beats a monolithic dump. This is a per-page
# editorial call, not an enforced rule -- flip it either way as real usage
# shows what's actually helpful.
#
# `sitetree_link: true` on a section adds the /sitetree.json pointer line
# after that section's pages. Keyed on this flag, not the section's
# title string, so renaming a section can't silently drop the link.
#
# `description` on a section is optional and renders verbatim as a line
# of Markdown between the heading and the section's link list -- use it
# only to resolve real ambiguity a flat link list can't (e.g. two
# sections that could be confused for each other), not as boilerplate
# that just restates the section title. Rendered as-is with no escaping
# or processing (this file is generated via Go's text/template, not
# html/template), so Markdown syntax -- bold, inline links -- comes
# through exactly as written. Real limitation: this is YAML, not just
# text, so always double-quote a description that contains Markdown --
# an unquoted value starting with `[` parses as a YAML flow sequence,
# not a string, and breaks the build.
sections:
  - title: "Start here for agents"
    pages:
      - path: /build-apps/use-viam-from-an-agent/
        full: true
      - path: /cli/drive-a-machine/
        full: true
      - path: /cli/reference/
  - title: "Reference"
    sitetree_link: true
    description: "Two distinct reference types share this section: **API reference** (client library methods called from code, e.g. \"Component APIs overview\") and **configuration reference** (JSON used to configure a resource on a machine, e.g. \"Built-in components\"). Match the entry to what you're actually doing."
    pages:
      - path: /reference/apis/components/overview/
      - path: /reference/apis/services/overview/
      - path: /reference/apis/robot/
      - path: /reference/apis/fleet/
      # /reference/components/ has no overview page of its own (unlike
      # its /reference/services/ sibling) -- it's a stub that redirects
      # arbitrarily to /reference/components/arm/. Tracked in DOCS-4972;
      # repoint this entry once that lands.
      - path: /reference/components/
      - path: /reference/services/
  - title: "Guides"
    pages:
      - path: /set-up-a-machine/first-machine/
      - path: /build-apps/overview/
      - path: /motion-planning/
      - path: /build-modules/overview/
